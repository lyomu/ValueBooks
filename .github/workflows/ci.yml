name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: valuebooks
          POSTGRES_USER: valuebooks
          POSTGRES_PASSWORD: valuebooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Attachment storage (uploads, OCR, exports, generated documents) needs a real S3-compatible
      # endpoint. MinIO's own images now require a registry login to pull, so this uses Localstack's
      # S3 service instead -- freely pullable, and its default entrypoint needs no command override.
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
        ports:
          - 59000:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # BullMQ-backed job queues (email, automation, document extraction) need a real Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Signup and invitation integration specs queue real email delivery.
      mailpit:
        image: axllent/mailpit:v1.27.8
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports:
          - 1025:1025
          - 8025:8025

      # Document extraction scans uploads for malware before processing them. CLAMAV_HOST/PORT
      # default to localhost:53310 (see packages/config), matching docker-compose.yml's clamav
      # service, so no extra env vars are needed in the steps below.
      clamav:
        image: clamav/clamav:1.4
        ports:
          - 53310:3310
        options: >-
          --health-cmd clamdcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 120s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace @valuebooks/api

      # Scoped to production dependencies (--omit=dev): dev/build-only tooling (vitest, the
      # eslint-plugin-next chain) is never shipped, so scanning it adds noise, not signal.
      # continue-on-error is temporary: one documented, owner-assigned advisory
      # (deepmerge-ts via @prisma/config, no upstream fix yet -- see docs/SECURITY_REVIEW.md)
      # has no fix available, which would otherwise make this step permanently red on every PR.
      # Remove continue-on-error once that advisory is resolved.
      - name: Dependency scan
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check migration drift
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks
          DATABASE_MIGRATION_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks
          SHADOW_DATABASE_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks_shadow
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE valuebooks_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Test
        run: npm test

      # document-rendering.service.ts launches a real headless Chromium to render PDFs;
      # npm ci installs the playwright package but not its browser binary.
      - name: Install Playwright Chromium
        working-directory: apps/api
        run: npx playwright install --with-deps chromium

      - name: Integration test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://valuebooks_app:ci_app_pw@localhost:5432/valuebooks
          DATABASE_MIGRATION_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          S3_ENDPOINT: http://localhost:59000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: valuebooks
          S3_SECRET_KEY: valuebooks-local
          REDIS_URL: redis://localhost:6379
          S3_BUCKET: valuebooks-local
        run: |
          # The harness grants this role access after applying migrations. Running
          # as the migration owner bypasses RLS and invalidates the isolation tests.
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE valuebooks_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'ci_app_pw'"
          npm run test:integration

      - name: Build
        run: npm run build

      - name: Validate Docker Compose
        # Production secrets live only on the box; validate the checked-in
        # structure without resolving its required .env.production file.
        run: docker compose -f docker-compose.prod.yml config --no-env-resolution --no-interpolate --quiet
