name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: valuebooks
          POSTGRES_USER: valuebooks
          POSTGRES_PASSWORD: valuebooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Attachment storage (uploads, OCR, exports, generated documents) needs a real S3-compatible
      # endpoint. GitHub Actions `services:` containers can't override `command`, and the official
      # minio image needs an explicit `server /data` command to start, so it's launched by hand
      # here instead -- the same image and startup command as docker-compose.yml's `minio` service.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 59000:9000 \
            -e MINIO_ROOT_USER=valuebooks \
            -e MINIO_ROOT_PASSWORD=valuebooks-local \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z server /data --console-address ':9001'
          for _ in $(seq 1 20); do
            curl -sf http://localhost:59000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy in time" >&2
          docker logs minio
          exit 1

      - name: Generate Prisma client
        run: npm run db:generate --workspace @valuebooks/api

      # Scoped to production dependencies (--omit=dev): dev/build-only tooling (vitest, the
      # eslint-plugin-next chain) is never shipped, so scanning it adds noise, not signal.
      # continue-on-error is temporary: one documented, owner-assigned advisory
      # (deepmerge-ts via @prisma/config, no upstream fix yet -- see docs/SECURITY_REVIEW.md)
      # has no fix available, which would otherwise make this step permanently red on every PR.
      # Remove continue-on-error once that advisory is resolved.
      - name: Dependency scan
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check migration drift
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks
          SHADOW_DATABASE_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks_shadow
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE valuebooks_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Test
        run: npm test

      - name: Integration test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks
          # The CI postgres service has no separate restricted runtime role, so the migration-owner
          # connection the integration harness provisions the test database with (see
          # apps/api/test/support/database.ts) is the same superuser as DATABASE_URL.
          DATABASE_MIGRATION_URL: postgresql://valuebooks:valuebooks@localhost:5432/valuebooks
          S3_ENDPOINT: http://localhost:59000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: valuebooks
          S3_SECRET_KEY: valuebooks-local
          S3_BUCKET: valuebooks-local
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet
