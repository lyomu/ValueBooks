# Production deployment fragment for the untrusted document parser/OCR worker. Provide the
# pre-built API image and an internal-only application network from the deployment environment:
#   VALUEBOOKS_API_IMAGE=registry.example/valuebooks-api:sha docker compose -f ... up -d
# This process has no HTTP listener and should not share a pod/container with the API.
services:
  document-extraction-worker:
    image: ${VALUEBOOKS_API_IMAGE:?Set VALUEBOOKS_API_IMAGE to the built ValueBooks API image}
    command: ['node', '--max-old-space-size=384', 'dist/src/document-extraction-worker.js']
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      NODE_ENV: production
      DOCUMENT_EXTRACTION_WORKER_CONCURRENCY: '1'
      DOCUMENT_EXTRACTION_TIMEOUT_MS: '90000'
      DOCUMENT_EXTRACTION_MAX_BYTES: '15728640'
      DOCUMENT_EXTRACTION_MAX_PAGES: '5'
      DOCUMENT_EXTRACTION_MAX_PAGE_PIXELS: '16000000'
      DOCUMENT_EXTRACTION_MAX_TOTAL_PIXELS: '40000000'
      DOCUMENT_EXTRACTION_MAX_TEXT_CHARS: '40000'
    networks:
      - valuebooks_internal
    restart: unless-stopped

networks:
  # The deployment owns this network. It must expose only PostgreSQL, Redis, S3/MinIO, and ClamAV;
  # do not attach this worker to a public-ingress network.
  valuebooks_internal:
    external: true
